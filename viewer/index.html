<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flowmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..600&display=swap">
<style>
/* One canvas of the project's screens, as the code renders them at one commit. Each page or flow is a panel; each screen sits at its real size
   with its name above it. Controls float over the canvas. Frame names and control text keep one size at every zoom; screens and connectors zoom. */
:root {
  --ground: #ffffff; --canvas: #f5f5f5; --ink: #1c1c1e; --ink-2: #4a4a51; --ink-3: #6b6b72;
  --line: #e6e6e3; --hover: #f1f1ef; --connector: #a3a3aa; --edge: rgba(20, 20, 24, .1); --hairline: rgba(20, 20, 24, .14);
  --term: #18181b; --term-ink: #f4f4f5; --fresh: #4c9a4c; --warn-bg: #fbf1e1; --warn-ink: #8a5208; --absent: #bdbdb8;
  --sel: #4f46e5; --focus: #4f46e5; --sel-grad: conic-gradient(from 200deg in oklch, #4f46e5, #0ea5e9 30%, #8b5cf6 62%, #4f46e5);
  --ease: cubic-bezier(.2, 0, 0, 1);
  --sans: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #1c1c1e; --canvas: #121213; --ink: #f2f2f3; --ink-2: #b4b4bb; --ink-3: #939399;
  --line: #2c2c30; --hover: #28282b; --connector: #6b6b72; --edge: rgba(255, 255, 255, .1); --hairline: rgba(255, 255, 255, .14);
  --term: #0c0c0e; --term-ink: #f4f4f5; --fresh: #6fbf6f; --warn-bg: rgba(224, 160, 64, .14); --warn-ink: #f0b863; --absent: #4a4a4f; --focus: #a5b4fc; color-scheme: dark } }
:root[data-theme="dark"] {
  --ground: #1c1c1e; --canvas: #121213; --ink: #f2f2f3; --ink-2: #b4b4bb; --ink-3: #939399;
  --line: #2c2c30; --hover: #28282b; --connector: #6b6b72; --edge: rgba(255, 255, 255, .1); --hairline: rgba(255, 255, 255, .14);
  --term: #0c0c0e; --term-ink: #f4f4f5; --fresh: #6fbf6f; --warn-bg: rgba(224, 160, 64, .14); --warn-ink: #f0b863; --absent: #4a4a4f; --focus: #a5b4fc; color-scheme: dark }
:root[data-theme="light"] { color-scheme: light; }
html, body { height: 100%; margin: 0; }
body { background: var(--canvas); color: var(--ink); font-family: var(--sans); font-size: .875rem; line-height: 1.45; overflow: hidden; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.float :focus-visible, .panel :focus-visible { outline-offset: -2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
svg { display: block; }

/* Canvas */
.viewport { position: fixed; inset: 0; overflow: hidden; background: var(--canvas); touch-action: none; cursor: grab; }
.viewport.panning { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; --inv: 1; }
/* Screens sit straight on the canvas with a hairline, kept one screen size at every zoom. */
.frame { position: absolute; padding: 0; border: 0; background: var(--ground); box-shadow: 0 0 0 calc(1px * var(--inv)) var(--edge); overflow: hidden; }
.frame img { display: block; width: 100%; height: auto; pointer-events: none; user-select: none; }
.frame canvas.dither { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; }
.frame.absent { background: transparent; box-shadow: none; outline: calc(1px * var(--inv)) dashed var(--absent); outline-offset: calc(-1px * var(--inv)); display: grid; place-content: center; gap: 16px; text-align: center; padding: 64px; }
.frame.absent .t { font-size: 32px; font-weight: 600; color: var(--ink-2); }
.frame.absent .w { font-size: 28px; line-height: 1.45; color: var(--ink-3); max-width: 760px; }
.frame.absent code { font-family: var(--mono); }
.frame:focus-visible { outline: calc(2px * var(--inv)) solid var(--focus); outline-offset: calc(6px * var(--inv)); }
.frame.sel { outline: none; }
.far .frame.absent { opacity: .45; }
/* Names, section headers and connector labels: screen text placed over the canvas, one size at every zoom. */
.names, .under { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.fname { position: absolute; container-type: inline-size; height: 20px; font-size: .8125rem; line-height: 1.2; white-space: nowrap; color: var(--ink-2); }
.fname .row { display: flex; align-items: center; gap: 12px; height: 20px; }
.fname .who { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1; overflow: hidden; }
.fname .n { overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; max-width: 100%; }
.fname .r { display: none; font-family: var(--mono); font-size: .75rem; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.fname.peek .r { display: inline; }
.fname.sel { color: var(--ink); }
.fname.sel .n { font-size: .9375rem; font-weight: 500; }
@container (max-width: 380px) { .fname.peek .r { display: none; } }
@container (max-width: 200px) { .warn .w { display: none; } }
.warn { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-ink); font-size: .75rem; font-weight: 500; flex: none; }
.warn svg { width: 12px; height: 12px; }
/* Compared with live: a label in the name row, and each changed area outlined with a thin dash at one screen size, in compare view. */
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border: .5px solid var(--hairline); border-radius: 999px; color: var(--ink-3); font-size: .75rem; flex: none; }
@container (max-width: 200px) { .tag { display: none; } }
/* Annotations belong to their modes: change outlines to compare, pins to comment mode. The canvas otherwise shows the screens as they are. */
.frame .chg { display: none; }
.pin { display: none !important; }
.commenting .pin { display: grid !important; }
.chg { position: absolute; outline: calc(1px * var(--inv)) dashed var(--warn-ink); outline-offset: calc(3px * var(--inv)); border-radius: calc(6px * var(--inv)); background: color-mix(in srgb, var(--warn-bg) 35%, transparent); pointer-events: none; }
/* Compare: over the selected screen, live drawn over this branch up to the handle. Drag the handle, or use the arrow keys on it. */
.cmp { position: absolute; z-index: 1; overflow: hidden; background: var(--ground); box-shadow: 0 0 0 calc(1px * var(--inv)) var(--edge); }
.cmp img { position: absolute; left: 0; top: 0; width: 100%; height: auto; pointer-events: none; user-select: none; }
.cmp .live { position: absolute; inset: 0; overflow: hidden; background: var(--ground); }
.cmp .handle { position: absolute; top: 0; bottom: 0; width: calc(32px * var(--inv)); margin-left: calc(-16px * var(--inv)); cursor: ew-resize; touch-action: none; }
.cmp .handle::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: calc(2px * var(--inv)); margin-left: calc(-1px * var(--inv)); background: var(--ink); }
.cmp .handle span { position: absolute; left: 50%; top: 50%; width: calc(28px * var(--inv)); height: calc(28px * var(--inv)); transform: translate(-50%, -50%); border-radius: 999px; background: var(--ink); box-shadow: 0 0 0 calc(3px * var(--inv)) var(--ground); }
.cmp .handle:focus-visible { outline: none; }
.cmp .handle:focus-visible span { box-shadow: 0 0 0 calc(3px * var(--inv)) var(--ground), 0 0 0 calc(5px * var(--inv)) var(--focus); }
.cmp .lab { position: absolute; top: calc(12px * var(--inv)); padding: calc(3px * var(--inv)) calc(10px * var(--inv)); border-radius: 999px; background: var(--ink); color: var(--ground); font-size: calc(12px * var(--inv)); font-weight: 500; line-height: 1.3; white-space: nowrap; pointer-events: none; }
.cmp .lab.l { left: calc(12px * var(--inv)); }
.cmp .lab.r { right: calc(12px * var(--inv)); background: var(--warn-ink); }
.sect { position: absolute; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; white-space: nowrap; }
.sect .t { margin: 0; font-weight: 600; line-height: 1.2; letter-spacing: -.012em; color: var(--ink); }
.sect .chips { display: flex; gap: 4px; }
.chip { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border: .5px solid var(--hairline); border-radius: 999px; background: var(--ground); font-size: .75rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
/* Links between screens: smooth curves that fade in from the source, a hollow port, a fine chevron. The selected or hovered
   screen's links turn indigo, so its flow reads at a glance. */
svg.links { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
svg.links path { fill: none; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
svg.links .hd { stroke: var(--connector); }
svg.links .hd.on { stroke: var(--sel); }
svg.links circle { fill: var(--canvas); stroke: var(--connector); stroke-width: 1; }
svg.links circle.on { stroke: var(--sel); }
/* A link's label: a tag on the final run into its screen, as wide as that run allows, wrapping when it must. */
.edge.on { color: var(--sel); }
/* The label sits on its line: centred on the level run into the target, the line breaking around it. It shows in full or not at all. */
.edge { position: absolute; translate: -50% -50%; width: max-content; font-size: .6875rem; font-weight: 500; line-height: 14px; letter-spacing: .01em; color: var(--ink-3); white-space: nowrap; }

/* Selected screen: a gradient ring, square handles and its size, as in a design tool. */
.selglow { position: absolute; box-shadow: 0 0 0 3px color-mix(in srgb, var(--sel) 12%, transparent), 0 0 28px color-mix(in srgb, var(--sel) 16%, transparent); }
.selring { position: absolute; box-sizing: border-box; border: 1px solid transparent; background: var(--sel-grad) border-box; -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) padding-box exclude, linear-gradient(#000 0 0); }
.selmark { position: absolute; z-index: 1; width: 6px; height: 6px; margin: -3px 0 0 -3px; background: var(--ground); border: 1px solid var(--sel); box-sizing: border-box; }
.seldims { position: absolute; z-index: 1; transform: translateX(-50%); padding: 2px 8px; border-radius: 6px; background: var(--sel); color: #fff; font-size: .75rem; font-weight: 500; line-height: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Floating controls */
.float { position: fixed; z-index: 10; display: flex; align-items: center; gap: 4px; background: var(--ground); border: .5px solid var(--hairline); border-radius: 12px; padding: 4px; }
.sep { width: 1px; align-self: stretch; margin: 4px; background: var(--line); flex-shrink: 0; }
/* All three bars are 32px of controls inside 4px padding, so their heights match. */
.top-left, .top-right { height: 32px; }
/* One outer margin, 8 px, for every bar and the panel. */
.top-left { top: calc(8px + env(safe-area-inset-top, 0px)); left: max(8px, env(safe-area-inset-left, 0px)); max-width: calc(100% - 260px); }
/* The screens panel's header, built like every bar: 4 px padding and controls 32 px tall with an 8 px radius (the bar's 12 less
   its padding), so every corner nests. Closed, it is one row: the panel button, the breadcrumb Flowmap / project, then the branch.
   Open, the breadcrumb and the button make the first row, and the branch a full-width second row, like a branch picker. */
.shead { display: flex; align-items: center; gap: 4px; min-width: 0; height: 32px; }
.crumb { display: flex; align-items: baseline; gap: 6px; min-width: 0; padding: 0 6px 0 4px; }
.word { flex: none; font-size: .875rem; font-weight: 700; letter-spacing: -.04em; user-select: none; }
.slash { flex: none; color: var(--ink-3); opacity: .6; font-size: .875rem; user-select: none; }
.brand { margin: 0; font-size: .875rem; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.shead .meta { display: flex; align-items: center; gap: 4px; min-width: 0; }
/* The branch: a field outlined by a hairline, lighter than the breadcrumb above it, so the project leads and the branch follows. */
.ver { display: flex; align-items: center; gap: 10px; height: 32px; box-sizing: border-box; padding: 0 10px; border-radius: 8px; box-shadow: inset 0 0 0 .5px var(--hairline); color: var(--ink-2); font-size: .8125rem; white-space: nowrap; min-width: 0; }
.ver svg { flex: none; width: 14px; height: 14px; margin-right: -4px; color: var(--ink-3); }
.ver .b { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ver code { flex: none; font-family: var(--mono); font-size: .75rem; color: var(--ink-3); }
.top-left .warn { margin: 0 4px; }
.stoggle svg { width: 16px; height: 16px; }
.side.open { z-index: 22; flex-direction: column; align-items: stretch; height: auto; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); width: 248px; max-width: calc(100% - 16px); box-sizing: border-box; padding: 0; border-radius: 12px; }
.side.open .shead { flex-wrap: wrap; height: auto; padding: 4px; }
/* Text in the open header starts 12 px from the panel's edge: 4 px of padding and 8 px inside each control. */
.side.open .crumb { flex: 1; padding-left: 8px; }
.side.open .stoggle { order: 2; }
/* The branch field is inset 12 px, the same as the text above it: its left edge lines up with "Flowmap". */
.side.open .meta { order: 3; flex-basis: 100%; flex-wrap: wrap; margin: 0 8px 4px; }
/* The field keeps its whole row; a freshness warning or the agent's activity wraps underneath it. */
.side.open .ver { flex: 1 0 100%; padding: 0 10px; }
.side.open .meta > .warn, .side.open .meta > .act { margin: 6px 0 0; }
.side.open .ver .b { flex: 1; }
.slist { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px; border-top: .5px solid var(--hairline); }
.slist ul { list-style: none; margin: 0; padding: 0; }
/* A tree: each level opens and closes on its chevron; nested levels hang from a hairline under their parent's chevron. */
.slist ul ul { margin-left: 13px; padding-left: 6px; border-left: .5px solid var(--hairline); }
.tr { display: flex; align-items: center; height: 28px; border-radius: 8px; color: var(--ink); }
.tr .chev, .tr .gap { flex: none; display: grid; place-items: center; width: 20px; height: 28px; padding: 0; border: 0; background: none; color: var(--ink-3); border-radius: 6px; }
.tr .chev svg { width: 12px; height: 12px; }
.tr .chev[aria-expanded="true"] svg { rotate: 90deg; }
.tr .go { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px 0 2px; border: 0; background: none; color: inherit; font: .8125rem var(--sans); text-align: start; border-radius: 6px; }
.tr .go > svg { flex: none; width: 16px; height: 16px; color: var(--ink-3); }
.tr .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr.sec .go { font-size: .75rem; font-weight: 600; color: var(--ink-2); }
.tr.grp .go { font-size: .75rem; font-weight: 500; color: var(--ink-3); }
.tr .count { font-weight: 400; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tr.on { background: var(--hover); }
.tr.on .go { font-weight: 500; }
.tr.on .go > svg { color: var(--ink); }
.tr .chg-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn-ink); flex: none; }
.tr .n { min-width: 16px; text-align: end; color: var(--ink-3); font-size: .75rem; font-variant-numeric: tabular-nums; flex: none; }
.tr .st { height: 18px; padding: 0 6px; font-size: .6875rem; }
.act { display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; font-size: .8125rem; color: var(--ink-2); white-space: nowrap; }
.act i { width: 7px; height: 7px; border-radius: 50%; background: var(--sel); }
.top-right { top: calc(8px + env(safe-area-inset-top, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); }
.bottom { bottom: calc(8px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); max-width: calc(100% - 16px); }
.seg { display: inline-flex; background: var(--hover); border-radius: 9px; padding: 2px; gap: 2px; flex-shrink: 0; }
.seg button { display: inline-grid; place-items: center; border: 0; background: transparent; height: 28px; padding: 0 12px; border-radius: 7px; color: var(--ink-2); font-size: .8125rem; }
.seg button[aria-pressed="true"] { background: var(--ground); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .1); font-weight: 500; }
.widths button { padding: 0 10px; }
.widths svg { width: 15px; height: 15px; }
.zbtn { display: inline-grid; place-items: center; border: 0; background: transparent; height: 32px; min-width: 32px; padding: 0 8px; border-radius: 8px; color: var(--ink-2); font-size: .8125rem; }
.zbtn svg { width: 14px; height: 14px; }
.zbtn.primary { display: inline-flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; background: var(--hover); color: var(--ink); font-weight: 500; letter-spacing: -0.005em; }
.zbtn.agents { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; color: var(--ink); }
.zbtn.agents svg { width: 16px; height: 16px; }
.zbtn.agents[aria-expanded="true"] { background: var(--hover); }
.zbtn.primary[aria-expanded="true"] { background: color-mix(in srgb, var(--hover), var(--ink) 7%); }

/* Connect panel: one row for each coding agent, each with one action. A connected agent shows that in its row.
   Until the agent has written recipes, the footer holds the sentence to ask it. */
.panel { position: fixed; z-index: 20; top: calc(56px + env(safe-area-inset-top, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: min(320px, calc(100% - 32px)); max-height: calc(100% - 96px); overflow-y: auto; overscroll-behavior: contain; box-sizing: border-box; background: var(--ground); border: .5px solid var(--hairline); border-radius: 14px; }
.panel h2 { margin: 0; padding: 14px 16px 12px; font-size: .8125rem; font-weight: 600; border-bottom: .5px solid var(--hairline); }
.clients { margin: 0; padding: 0; list-style: none; }
.clients li { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px 0 16px; }
.clients li + li { border-top: .5px solid var(--hairline); }
.logo { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; border: .5px solid var(--hairline); color: var(--ink); }
.logo svg { width: 16px; height: 16px; }
.clients .nm { flex: 1; min-width: 0; font-size: .8125rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rowbtn { flex: none; display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border: .5px solid var(--hairline); border-radius: 7px; background: var(--ground); color: var(--ink); font: 500 .75rem/1 var(--sans); text-decoration: none; white-space: nowrap; box-shadow: 0 1px 1px rgba(0, 0, 0, .04); }
.linked { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; color: var(--ink-2); white-space: nowrap; }
.linked i { width: 6px; height: 6px; border-radius: 50%; background: var(--fresh); }
.ask { padding: 12px 16px 16px; border-top: .5px solid var(--hairline); background: var(--canvas); }
.ask p { margin: 0 0 8px; font-size: .75rem; color: var(--ink-3); }
.say { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 12px; border: .5px solid var(--hairline); border-radius: 8px; background: var(--ground); font-size: .8125rem; }
.say span { flex: 1; min-width: 0; }
.copy { flex: none; display: inline-grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-2); }
.copy svg { width: 14px; height: 14px; }

/* Selected screen's actions, attached inside the top of the frame. */
.tool { position: fixed; z-index: 15; display: flex; align-items: center; gap: 4px; padding: 4px; background: var(--ink); color: var(--ground); border-radius: 12px; white-space: nowrap; }
.tbtn { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--ground); font-size: .8125rem; font-weight: 500; text-decoration: none; }
.tbtn svg { width: 15px; height: 15px; color: color-mix(in srgb, var(--ground) 70%, transparent); }
.tbtn:focus-visible { outline: 2px solid var(--ground); outline-offset: -2px; }
.tbtn[aria-pressed="true"] { background: color-mix(in srgb, var(--ground) 18%, transparent); }

/* Comment mode: with Comment on, the element under the pointer is outlined; click it, or drag a box, and the note opens there.
   Tasks show as numbered pins on their screen; a pin opens its thread in place. Marks are indigo, apart from the dashed amber of changes from live. */
.commenting .frame:not(.absent) { cursor: crosshair; }
.hover-el, .tmark { position: absolute; border-radius: calc(4px * var(--inv)); pointer-events: none; }
.hover-el { outline: calc(1px * var(--inv)) solid var(--sel); outline-offset: calc(2px * var(--inv)); }
.tmark { outline: calc(1.5px * var(--inv)) solid var(--sel); outline-offset: calc(2px * var(--inv)); background: color-mix(in srgb, var(--sel) 6%, transparent); }
.pin { position: absolute; z-index: 2; display: grid; place-items: center; width: calc(24px * var(--inv)); height: calc(24px * var(--inv)); margin: calc(-12px * var(--inv)) 0 0 calc(-12px * var(--inv)); padding: 0; border: calc(2px * var(--inv)) solid var(--ground); border-radius: 999px 999px 999px 0; background: var(--sel); color: #fff; font: 600 calc(11px * var(--inv)) / 1 var(--sans); font-variant-numeric: tabular-nums; box-shadow: 0 calc(1px * var(--inv)) calc(4px * var(--inv)) rgba(0, 0, 0, .18); cursor: pointer; }
.pin.sent-back { background: var(--warn-ink); }
.pin.ready-for-review { background: var(--ground); color: var(--sel); border-color: var(--sel); }
.pin[aria-expanded="true"] { box-shadow: 0 0 0 calc(3px * var(--inv)) color-mix(in srgb, var(--sel) 25%, transparent); }

<aside class="float top-left side" id="side" aria-labelledby="brand">

    shot ? `<img src="${esc(shot.png)}" alt="" decoding="async">${areasOf(shot)}` : `<span class="t">Not captured yet</span><span class="w">Ask your coding agent to capture <code>${esc(s.id)}</code>.</span>`);

  n.className = "fname" + (selected === s.id ? " sel" : "");
  n.dataset.id = s.id;
  const warn = shot?.landedOn ? `<span class="warn" title="The app opened ${esc(shot.landedOn)} instead of ${esc(s.route)}">${icon("danger-triangle-linear")}<span class="w">Landed on ${esc(shot.landedOn)}</span></span>` : "";

    ? `<span class="warn" title="${shot.compare.areas.length} changed ${shot.compare.areas.length === 1 ? "area" : "areas"}">${icon("routing-2-linear")}<span class="w">Changed from live</span></span>`

/* What changed from live, outlined at each changed element's exact box, or at the changed pixels when no element accounts for them. */
const areasOf = (shot) => (shot.compare?.areas ?? []).flatMap((a) => (a.changes.length ? a.changes.filter((c) => c.box).map((c) => c.box) : [a]))
  .map((b) => `<i class="chg" aria-hidden="true" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px"></i>`).join("");

/* The frame a task belongs on: the version it was marked on or chose, or else its screen. */
const taskFrame = (t) => (t.variant ? `v:${t.variant.set}:${t.variant.name}:${t.state}` : t.choice ? `v:${t.choice.set}:${t.choice.name}:${t.state}` : t.state);

/* A frame's capture and what it shows: a screen, or a version of one ("v:set:name:state"). */
function frameInfo(id) {
  if (!id.startsWith("v:")) { const s = byId().get(id); return { shot: shotOf(id), name: s?.name ?? id, state: id, commit: data.shown?.commit }; }
  const [, set, name, state] = id.split(":");
  const option = (data.variants ?? []).find((v) => v.set === set)?.options.find((o) => o.name === name);
  const label = name.length === 1 ? name.toUpperCase() : name;
  return { shot: option?.shots[state]?.[String(width)], name: `Version ${label} of ${set}`, state, commit: option?.commit, variant: { set, name } };

/* Versions to choose from: one section for each set, the versions side by side, one row for each screen they cover. */

      const known = Math.max(0, ...options.map((o) => o.shots[st]?.[String(width)]?.height ?? 0)) || (width >= 768 ? 900 : 844);

        if (!shot && !making) return;
        const id = versionId(v.set, o.name, st), x = i * (width + GAP), h = shot?.height ?? known;

        const f = put("button", "frame", x, top, width, h, making ? `<canvas class="dither" aria-hidden="true"></canvas>` : `<img src="${esc(shot.png)}" alt="" decoding="async">`);

        if (making) { f.classList.add("building"); f.dataset.title = `Version ${letter}`; building.add(id); }

        n.innerHTML = `<div class="row"><span class="who"><span class="n">${esc(label)}</span></span>${making ? `<span class="st building">Building</span>` : chosen?.choice?.name === o.name ? `<span class="st approved">Chosen</span>` : ""}</div>`;

        labels.push({ n, x, y: top, w: width, h });
        rowH = Math.max(rowH, h); maxX = Math.max(maxX, x + width);

/* A version being built: its title as a mosaic of dots, dithered over a slow wave, until its capture arrives. Then the mosaic

let wasBuilding = new Set(), ditherLoop = 0;

  const c = document.createElement("canvas"); c.width = cols; c.height = rows;

  const size = Math.min(rows * 0.5, (rows * 0.5 * cols * 0.6) / Math.max(1, g.measureText(text).width));

/* Flows come from the recipes' leadsTo links: each group of linked states is one flow, drawn as trees from the states nothing leads to. */
function flows() {

/* Flows: each tree left to right, one row for each end screen; a screen sits on the row of its first next screen. */

/* Pages: one panel for each page the recipes name, its screens in one row. */

/* Links in screen pixels, so every curve, gap, port and arrowhead keeps one size at every zoom. Each link is one smooth S-curve

    const own = openTasks(s.id), review = own.some((t) => t.status === "ready-for-review");
    const label = [s.name, shot ? "" : "not captured yet", changed ? "changed from live" : "", review ? "a task to review" : own.length ? `${own.length} ${own.length === 1 ? "task" : "tasks"}` : ""].filter(Boolean).join(", ");

      ? areas.map((a) => node("grp", `a:${a}`, a || "Other", "", null, groups.filter((g) => g.area === a).map(pageNode).join(""))).join("")

$("slist").addEventListener("click", (e) => {

    const key = row.dataset.key;

world.addEventListener("click", (e) => { const p = e.target.closest(".pin"); if (p) { e.stopPropagation(); openThread(data.tasks.find((t) => t.id === p.dataset.task)); } });

/* The part of a picture around a box, scaled to the crop's width: the box and 24 px around it, or the whole screen. */

  const b = task.area ? { x: Math.max(0, task.area.x - 24), y: Math.max(0, task.area.y - 24), w: task.area.w + 48, h: task.area.h + 48 } : full;
  return `<button class="crop" type="button" data-act="expand" aria-label="Open ${esc(label.toLowerCase())} and after full size" style="aspect-ratio:${b.w} / ${b.h}"><img src="${esc(png)}" alt="${esc(label)}" style="width:${(task.width / b.w) * 100}%;left:${(-b.x / b.w) * 100}%;top:${(-b.y / b.h) * 100}%"><span aria-hidden="true">${esc(label)}</span></button>`;

$("expandClose").addEventListener("click", () => $("expand").close());
$("expand").addEventListener("click", (e) => { if (e.target === $("expand")) $("expand").close(); });
const promptOf = (t) => {

  try {
    const f = frameInfo(draft.id);
    await postTask("/api/tasks", { state: f.state, width, commit: f.commit, words, ...(draft.area ? { area: draft.area } : {}), ...(f.variant ? { variant: f.variant } : {}) });

    <ul class="clients">${rows.map((r) => {
      const agent = latest(r.id);
      return `<li><span class="logo">${icon(`logo-${r.id}`)}</span><span class="nm">${esc(r.name)}</span>${agent ? `<span class="linked"><i></i>Connected ${ago(agent.connectedAt)}</span>` : r.action}</li>`;
    }).join("")}</ul>${data.states.length ? "" : `
    <div class="ask"><p>Then ask your agent</p>
      <div class="say"><span>${ASK}</span><button class="copy" type="button" data-copy="${ASK}" aria-label="Copy the sentence">${icon("copy-linear")}</button></div></div>`}`;
  if (focused) [...panel.querySelectorAll("[aria-label]")].find((el) => el.getAttribute("aria-label") === focused)?.focus();
  // Once an agent is connected, the button shrinks to that agent's logo: it still opens the panel to connect another.
  const btn = $("connectBtn"), linked = rows.filter((r) => latest(r.id));
  btn.classList.toggle("primary", !linked.length);
  btn.classList.toggle("agents", linked.length > 0);
  btn.innerHTML = linked.length ? linked.map((r) => icon(`logo-${r.id}`)).join("") : `${icon("plug-circle-linear")}Connect`;
  btn.setAttribute("aria-label", linked.length ? `${linked.map((r) => r.name).join(" and ")} connected. Connect another agent` : "Connect an agent");
  btn.title = linked.length ? `${linked.map((r) => r.name).join(" and ")} connected` : "";
}
function toggleConnect(open) {
  if (open) closePop();
  const panel = $("connect"), btn = $("connectBtn");
  panel.hidden = !open; btn.setAttribute("aria-expanded", String(open));
  if (open) panel.querySelector("button, a")?.focus(); else btn.focus();
}
$("connectBtn").addEventListener("click", () => toggleConnect($("connect").hidden));
$("emptyConnect").addEventListener("click", () => toggleConnect(true));
$("connect").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const label = b.getAttribute("aria-label");
  try {
    await navigator.clipboard.writeText(b.dataset.copy);
    const svg = b.querySelector("svg"), text = b.textContent;
    if (svg) svg.outerHTML = icon("check-linear"); else b.textContent = "Copied";
    b.setAttribute("aria-label", "Copied");
    setTimeout(() => { if (svg) b.querySelector("svg").outerHTML = icon("copy-linear"); else b.textContent = text; b.setAttribute("aria-label", label); }, 1500);
  } catch {
    // Without clipboard access, show the text so the person can copy it by hand.
    window.prompt("Copy this:", b.dataset.copy);
  }
});
document.addEventListener("pointerdown", (e) => { if (!$("connect").hidden && !$("connect").contains(e.target) && e.target !== $("connectBtn")) toggleConnect(false); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("expand").open) return;
  if (e.key === "Escape") { if (!$("connect").hidden) { toggleConnect(false); return; } if (!$("pop").hidden) { closePop(); return; } if (commenting) { setCommenting(false); return; } if (comparing) { setCompare(null); return; } if (selected) { deselect(); return; } }
  if (e.target.matches("input, textarea, select, [role=listbox]")) return;
  if (e.key === "0") fitAll();
  else if (e.key === "c" || e.key === "C") setCommenting(!commenting);
  else if (e.key === "+" || e.key === "=") zoomAt(1.25, innerWidth / 2, innerHeight / 2, true);
  else if (e.key === "-") zoomAt(0.8, innerWidth / 2, innerHeight / 2, true);
});
window.addEventListener("resize", () => apply());

/* ---------- Data ---------- */
async function load(keepView) {
  const res = await fetch("/api/flowmap");
  const next = await res.json();
  if (!res.ok) throw new Error(next.error ?? `Flowmap answered ${res.status}`);
  const first = !data;
  data = next;
  if (first && !flows().length) setMode("pages");
  fillWidths(); fillFreshness(); fillConnect();
  render(keepView && !first);
}
/* Light or dark: the person's choice, kept in this browser, or else the system's. */
try { const kept = localStorage.getItem("flowmap.theme"); if (kept === "light" || kept === "dark") document.documentElement.dataset.theme = kept; } catch { document.documentElement.removeAttribute("data-theme"); }
const dark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
function fillTheme() {
  const b = $("themeBtn"), toDark = !dark();
  b.innerHTML = icon(toDark ? "moon-linear" : "sun-2-linear");
  b.setAttribute("aria-label", toDark ? "Switch to dark mode" : "Switch to light mode");
  b.title = b.getAttribute("aria-label");
}
async function start() {
  ICONS = await (await fetch("/icons.json")).json();
  $("commentBtn").innerHTML = `${icon("chat-round-line-linear")}Comment`;
  $("sideBtn").innerHTML = icon("panel-left-linear");
  fillTheme();
  $("themeBtn").addEventListener("click", () => {
    const next = dark() ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    fillTheme();
    if (data) render(true);
    // Without storage, the choice lasts until the page is reloaded.
    try { localStorage.setItem("flowmap.theme", next); } catch { return; }
  });
  let saved = null;
  try { saved = localStorage.getItem("flowmap.side"); } catch { saved = null; }
  setSide(saved ? saved === "open" : innerWidth >= 1024, false);
  await load(false);
  const events = new EventSource("/api/events");
  events.addEventListener("update", () => { load(true).catch(showError); });
  events.addEventListener("activity", (e) => showActivity(JSON.parse(e.data)));
}
function showError(error) {
  $("empty").hidden = false;
  $("emptyTitle").textContent = "Flowmap could not load";
  $("emptyText").textContent = `${error.message}. Check that "flowmap serve" is still running.`;
  $("emptyConnect").hidden = true;
}
start().catch(showError);
</script>
</body>
</html>
